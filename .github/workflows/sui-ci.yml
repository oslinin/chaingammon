name: Sui port CI

# CI for the sui/ workspace (docs/superpowers/plans/2026-07-08-sui-port.md).
# Deliberately separate from ci.yml so Sui-branch churn never conflicts with
# the main CI workflow (see plan Task 0, Step 5).

on:
  push:
    branches: [sui]
  pull_request:
    branches: [sui]

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-sui-cli
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: sui move build
        working-directory: sui/move/chaingammon
        run: sui move build

      - name: sui move test
        working-directory: sui/move/chaingammon
        run: sui move test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter sui-app...

      - name: Type-check
        run: pnpm exec tsc --noEmit
        working-directory: sui/app

      - name: Build
        run: pnpm run build
        working-directory: sui/app

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox
        working-directory: sui/app

      - name: Playwright tests
        run: pnpm run test:e2e
        working-directory: sui/app

  # Separate from `app` above: this job needs the `sui` CLI to stand up a
  # real local network (Task 5 Step 4 — AUTH_MODE=mock sign-in creates a
  # HumanProfile on-chain, unlike the unrated P2P suite in the `app` job,
  # which has no chain dependency at all). Kept as its own job so a slow or
  # flaky localnet never blocks the unrated-play suite's own signal.
  app-localnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-sui-cli
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter sui-app... --filter sui-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: sui/app

      - name: Playwright tests (localnet)
        run: pnpm run test:e2e:localnet
        working-directory: sui/app

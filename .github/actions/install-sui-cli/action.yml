name: Install Sui CLI
description: >
  Installs the pinned testnet-* release of the `sui` CLI from GitHub
  Releases. Factored out of sui-ci.yml's `move` job (Task 0) so the same
  install logic can be reused by any job that needs `sui` — the `move` job
  and, from Task 5 on, any job that needs to run a local network
  (`sui start`) for a Playwright spec.

inputs:
  github-token:
    description: >
      Token for authenticating the api.github.com calls below. Unauthenticated
      requests are capped at 60/hour per runner IP range, shared across every
      GitHub Actions job in flight — easy to exhaust. Pass
      ${{ secrets.GITHUB_TOKEN }} (read-only, needs no owner setup).
    required: true
  release-tag:
    description: >
      Exact testnet-* release tag to install (see sui/README.md "Toolchain
      version" for the one last verified green in CI). Empty string falls
      back to the newest testnet-* release, which is less reproducible.
    required: false
    default: "testnet-v1.75.1"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SUI_RELEASE_TAG: ${{ inputs.release-tag }}
        GH_API_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        AUTH_HEADER="Authorization: Bearer ${GH_API_TOKEN}"
        if [ -z "$SUI_RELEASE_TAG" ]; then
          TAG=$(curl -fsSL -H "$AUTH_HEADER" https://api.github.com/repos/MystenLabs/sui/releases \
            | jq -r '[.[] | select(.tag_name | startswith("testnet-"))][0].tag_name')
        else
          TAG="$SUI_RELEASE_TAG"
        fi
        echo "Using Sui CLI release: $TAG"
        ASSET_URL=$(curl -fsSL -H "$AUTH_HEADER" "https://api.github.com/repos/MystenLabs/sui/releases/tags/$TAG" \
          | jq -r '.assets[] | select(.name | test("ubuntu.*x86_64.*\\.tgz$")) | .browser_download_url' | head -n1)
        if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
          echo "::error::Could not find an ubuntu-x86_64 asset for release $TAG" >&2
          exit 1
        fi
        # Extract into an isolated temp dir, NOT the checkout root — the repo
        # has a top-level sui/ directory (this very port), and the release
        # tarball's flat `sui` binary collides with it
        # ("tar: ./sui: Cannot open: File exists") if extracted in place.
        EXTRACT_DIR="$(mktemp -d)"
        curl -fsSL -o "$EXTRACT_DIR/sui-cli.tgz" "$ASSET_URL"
        tar -xzf "$EXTRACT_DIR/sui-cli.tgz" -C "$EXTRACT_DIR"
        # The tarball layout has varied across releases (flat binary vs. a
        # bin/ subdirectory) — find the `sui` executable wherever it landed.
        SUI_BIN=$(find "$EXTRACT_DIR" -maxdepth 3 -type f -name sui -perm -u+x | head -n1)
        if [ -z "$SUI_BIN" ]; then
          echo "::error::sui binary not found after extracting $ASSET_URL" >&2
          exit 1
        fi
        sudo install -m 755 "$SUI_BIN" /usr/local/bin/sui
        rm -rf "$EXTRACT_DIR"
        sui --version
